# VPS (nginx) uchun namuna. domen: vivaconstructions.uz;, root ni dist papkasi yo‘liga almashtiring.
server {
    listen 80;
    server_name vivaconstructions.uz www.vivaconstructions.uz;
    root /var/www/viva/dist;
    index index.html;

    location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; }
    location /images/ { expires 1d; }

    # React Router: mavjud bo‘lmagan manzillar index.html ga
    location / { try_files $uri $uri/index.html /index.html; }

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;
}
